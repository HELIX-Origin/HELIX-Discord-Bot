services:
  helix-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helix-discord-bot
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_CALLBACK_URL=${DISCORD_CALLBACK_URL:-http://localhost:5000}
      - NEXT_PUBLIC_INVITE_URL=${NEXT_PUBLIC_INVITE_URL:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:5000}
      - NEXTAUTH_INTERNAL_URL=${NEXTAUTH_INTERNAL_URL:-http://localhost:5000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - CLONE_CLI=${CLONE_CLI:-}
      - DISCORD_DB_PATH=/app/data/helix-bot.sqlite
