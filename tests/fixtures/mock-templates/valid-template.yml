name: "mock-sample"
description: "Sample template fixture for testing variable substitution"
category: "web"
framework: "react"
language: "typescript"
variables:
  - name: PROJECT_NAME
    description: "Name of the project"
    default: "my-mock-app"
  - name: AUTHOR_NAME
    description: "Author name"
    default: "HELIX Contributor"
files:
  - path: "package.json"
    content: |
      {
        "name": "{{PROJECT_NAME}}",
        "version": "1.0.0",
        "author": "{{AUTHOR_NAME}}"
      }
  - path: "README.md"
    content: |
      # {{PROJECT_NAME}}
      Created with HELIX CLI by {{AUTHOR_NAME}}.
