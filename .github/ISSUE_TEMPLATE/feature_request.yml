name: "Feature Request"
description: "Suggest a new feature, Discord bot command, or improvement for HELIX"
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Have a feature idea for HELIX?
        We welcome proposals for new Discord bot commands, language plugin capabilities, dashboard tools, and integrations!

  - type: dropdown
    id: scope
    attributes:
      label: Target Feature Scope
      description: Which part of HELIX does this feature enhance?
      options:
        - "Discord Bot Commands (Moderation, Utility, Info, Project, Config)"
        - "Language Plugin System & Code Intelligence Engine"
        - "Multi-Source Code Ingestion & Source Providers"
        - "Ticket System, Modal Interactions & Logging"
        - "Web Dashboard Interface & OAuth2 Authentication"
        - "Scaffolding Engine & Starter Templates"
        - "Database, Migrations & Persistence"
        - "Docker Container & Self-Hosting"
        - "Multi-Agent Configurations (.agents, .copilot, .gemini, .opencode)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a specific problem or workflow limitation?
      placeholder: "e.g., I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and detailed description of what you want to happen.
      placeholder: "e.g., Add a new command `>...` that accepts `--flag` and automatically..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: What other approaches or workarounds have you considered?
    validations:
      required: false

  - type: textarea
    id: mermaid-diagram
    attributes:
      label: Architecture / Workflow Mermaid Diagram (Optional)
      description: Provide a Mermaid sequenceDiagram or flowchart for the proposed feature architecture.
      placeholder: |
        ```mermaid
        flowchart TD
            User["User Trigger"] --> Command["Bot Command"]
            Command --> Service["Target Module"]
            Service --> Result["Render messages.json Embed"]
        ```
      render: markdown

  - type: textarea
    id: sub-issues
    attributes:
      label: Implementation Sub-Tasks / Sub-Issues (Optional)
      description: Breakdown of milestone sub-issues for implementing this feature.
      placeholder: |
        - [ ] Sub-Issue 1: Architecture & API Design
        - [ ] Sub-Issue 2: Core Feature Implementation
        - [ ] Sub-Issue 3: Automated Test Suite (Vitest)
        - [ ] Sub-Issue 4: User Documentation & Help Commands
      render: markdown

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Mockups
      description: Add any mockups, screenshots, sample Discord outputs, or architectural sketches.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have verified this feature is not already supported or requested.
          required: true
