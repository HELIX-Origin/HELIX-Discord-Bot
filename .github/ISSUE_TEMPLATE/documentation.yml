name: "Documentation Improvement"
description: "Suggest improvements, fixes, or additions to HELIX CLI documentation"
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ### Improve HELIX Documentation
        Clear and comprehensive documentation is vital. Let us know where we can clarify, fix, or expand!

  - type: dropdown
    id: doc-section
    attributes:
      label: Affected Documentation Area
      options:
        - "README.md (Main Project Overview & Quick Start)"
        - "docs/index.md (Documentation Hub)"
        - "docs/discord-bot.md (Discord Bot & Slash Commands)"
        - "docs/web-dashboard.md (NextAuth Dashboard & API)"
        - "docs/deployment-docker.md (Docker & Self-Hosting Guide)"
        - "docs/deployment-heroku.md (Heroku 1-Click Deployment)"
        - "docs/scaffolding-templates.md (14 Starter Templates)"
        - "docs/ai-integration.md (AI Credential Discovery)"
        - ".agents/ (Universal Agents & Framework Skills)"
        - "CLI Inline Help (helix --help / man pages)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Description of the Documentation Issue
      description: What is incorrect, unclear, or missing?
      placeholder: "e.g., The Docker Compose command in docs/deployment-docker.md does not mention..."
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Revision / Proposed Content
      description: How should the documentation read instead?
    validations:
      required: true
