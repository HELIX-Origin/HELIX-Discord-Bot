name: "AI Provider / Agent Integration"
description: "Propose integrating a new AI coding assistant or local model provider"
title: "[AI Provider]: "
labels: ["ai-integration", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### Propose an AI Agent Integration
        HELIX CLI supports Google Antigravity, GitHub Copilot, and Open Code. Help us expand support for modern AI assistants!

  - type: input
    id: provider-name
    attributes:
      label: AI Tool / Model Provider Name
      placeholder: "e.g. Claude Code, Cursor, Ollama, DeepSeek, AWS Q"
    validations:
      required: true

  - type: dropdown
    id: discovery-mechanism
    attributes:
      label: Primary Credential Discovery Mechanism
      description: How should HELIX automatically discover the user's active session?
      options:
        - "Official CLI session (e.g. CLI command returning active token)"
        - "Local Configuration File (e.g. ~/.config/<tool>/credentials.json)"
        - "Local Model Server (e.g. http://localhost:11434)"
        - "API Key / Environment Variable (.env fallback)"
        - "Multiple of the above (Tiered)"
    validations:
      required: true

  - type: textarea
    id: discovery-details
    attributes:
      label: Credential Discovery Details
      description: Specific path patterns across Windows, macOS, and Linux, or CLI probe commands.
      placeholder: |
        - Linux/macOS: ~/.config/<provider>/token.json
        - Windows: %APPDATA%\<provider>\config.json
        - CLI Probe: `<tool> auth status`
    validations:
      required: true

  - type: textarea
    id: capabilities
    attributes:
      label: Target Capabilities & Endpoints
      description: What features should be enabled for this provider?
      placeholder: |
        - `helix ai query "<question>"`
        - `helix ai generate "<feature>"`
        - Discord bot slash command `/helix-ai provider:<name>`
    validations:
      required: true

  - type: input
    id: docs-link
    attributes:
      label: Documentation / API Reference Link
      placeholder: "https://docs.provider.com/api"
    validations:
      required: false
