name: "New Starter Template Request"
description: "Propose a new framework, language, or game engine scaffolding starter template"
title: "[Template]: "
labels: ["template-request", "scaffolding"]
body:
  - type: markdown
    attributes:
      value: |
        ### Propose a New Framework Starter Template
        HELIX supports 17 multi-framework starter templates across Web, Desktop, Mobile, Game Engines, and Backend Services. Propose a new production-ready starter template here!

  - type: dropdown
    id: domain
    attributes:
      label: Project Domain
      options:
        - "Web Applications (e.g. Next.js, Nuxt, SvelteKit, Astro, Remix)"
        - "Desktop Applications (e.g. Wails, Tauri + React, Qt, Flutter Desktop)"
        - "Mobile Applications (e.g. Kotlin Multiplatform, Ionic, Capacitor)"
        - "Game Engines (e.g. Godot C#, Unreal Engine, Bevy Rust, Defold)"
        - "Backend Services & APIs (e.g. Bun Elysia, Elixir Phoenix, NestJS, FastAPI)"
        - "Developer Tooling / Library Starter"
        - "Other"
    validations:
      required: true

  - type: input
    id: framework-name
    attributes:
      label: Framework / Engine & Language
      description: Name the target framework and programming language
      placeholder: "e.g. Next.js 15 (TypeScript) or Bevy 0.14 (Rust)"
    validations:
      required: true

  - type: textarea
    id: structure
    attributes:
      label: Proposed Project Directory Structure
      description: Outline the essential files and directories for a clean, idiomatic starter.
      placeholder: |
        my-project/
        ├── src/
        ├── package.json (or Cargo.toml / go.mod)
        ├── README.md
        └── ...
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Recommended Commands & Toolchain
      description: What are the standard setup, dev, build, and test commands?
      placeholder: |
        - Setup: npm install / cargo build
        - Dev: npm run dev / cargo run
        - Build: npm run build / cargo build --release
    validations:
      required: true

  - type: textarea
    id: mermaid-diagram
    attributes:
      label: Scaffolding Directory Flow / Architecture (Optional)
      description: Mermaid diagram visualizing the scaffolded layout and lifecycle.
      placeholder: |
        ```mermaid
        flowchart TD
            Scaffold["`>project scaffold`"] --> Engine["template-engine.ts"]
            Engine --> Output["Generated Project Starter"]
        ```
      render: markdown

  - type: textarea
    id: sub-issues
    attributes:
      label: Implementation Sub-Tasks / Sub-Issues (Optional)
      description: Breakdown of milestone sub-issues for adding this template.
      placeholder: |
        - [ ] Sub-Issue 1: YML Template Definition in `.agents/templates/`
        - [ ] Sub-Issue 2: Scaffolding Generator Implementation
        - [ ] Sub-Issue 3: Vitest Integration Tests
        - [ ] Sub-Issue 4: Documentation in `docs/scaffolding-templates.md`
      render: markdown

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have verified this framework starter is not already supported.
          required: true
