name: "Bug Report"
description: "Report unexpected behavior, crashes, or errors in HELIX Bot, Web Dashboard, or Plugins"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for reporting a bug!
        Please search existing issues to avoid filing duplicates. Ensure you are running the latest version of HELIX.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of HELIX is encountering the issue?
      options:
        - "Discord Bot Commands (Moderation, Utility, Info, Project, Config)"
        - "Language Plugin System & Code Intelligence Engine (>lint, >explain, >debug, >refactor, >generate, >inspect, >docs)"
        - "Multi-Source Code Ingestion & Source Providers (GitHub, GitLab, Bitbucket, Pastebins)"
        - "Thread-based Ticket System & Interactive Modals/Buttons"
        - "Web Dashboard & NextAuth OAuth2 Server"
        - "Project Scaffolding Engine (17 Starter Templates)"
        - "SQLite Database & Migrations"
        - "Docker Container & Self-Hosting"
        - "Multi-Agent Configurations (.agents, .copilot, .gemini, .opencode)"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System / Environment
      description: What operating system or platform is HELIX running on?
      options:
        - "Windows 11 / 10 (PowerShell)"
        - "Windows 11 / 10 (CMD / Git Bash)"
        - "Linux (Ubuntu / Debian / Mint)"
        - "Linux (Arch / Fedora / RHEL)"
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Docker Container"
        - "Cloud Hosting (Heroku, Railway, Render, Fly.io)"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Runtime Version
      description: Run `node -v` in your terminal
      placeholder: "e.g. v22.5.0, v20.18.0"
    validations:
      required: true

  - type: input
    id: bot-version
    attributes:
      label: HELIX Version
      description: Bot version or Git commit hash
      placeholder: "e.g. 1.0.0 or 06c416d"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the bug.
      placeholder: |
        1. Run bot command `>...` or perform dashboard action `...`
        2. Provide arguments or code snippet: ...
        3. Observe error: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Stack Trace
      description: Paste any relevant terminal logs, stack traces, or diagnostic output.
      render: shell

  - type: textarea
    id: mermaid-diagram
    attributes:
      label: Mermaid Diagram (Optional)
      description: Provide a Mermaid sequenceDiagram or flowchart visualizing the reproduction or system failure.
      placeholder: |
        ```mermaid
        flowchart LR
            User["User Trigger: >command"] --> Handler["message-handler.ts"]
            Handler -->|"Failing Condition"| Error["💥 Defect Occurs"]
        ```
      render: markdown

  - type: textarea
    id: sub-issues
    attributes:
      label: Sub-Issues / Proposed Task Breakdown (Optional)
      description: Proposed sub-issues or task checklist for triaging and resolving this issue.
      placeholder: |
        - [ ] Sub-Issue 1: Root Cause & Diagnostics
        - [ ] Sub-Issue 2: Core Fix & Implementation
        - [ ] Sub-Issue 3: Test Suite & Regression Checks
        - [ ] Sub-Issue 4: Verification & Docs Sync
      render: markdown

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have verified this is not a duplicate of an existing issue.
          required: true
        - label: I am running Node.js v22.x or a supported LTS runtime.
          required: true
