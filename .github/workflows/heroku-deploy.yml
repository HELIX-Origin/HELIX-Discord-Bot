name: Deploy HELIX to Heroku (Free-Tier Eco Dyno)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Bot & Dashboard to Heroku
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Sync GitHub Secrets to Heroku & Deploy
        if: env.HEROKU_API_KEY != '' && env.HEROKU_APP_NAME != ''
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_CALLBACK_URL: ${{ secrets.DISCORD_CALLBACK_URL }}
          NEXT_PUBLIC_INVITE_URL: ${{ secrets.NEXT_PUBLIC_INVITE_URL }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_INTERNAL_URL: ${{ secrets.NEXTAUTH_INTERNAL_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          echo "Syncing GitHub Secrets to Heroku Config Vars..."
          # Install Heroku CLI
          curl https://cli-assets.heroku.com/install.sh | sh

          # Set Heroku config vars from GitHub Secrets
          heroku config:set \
            DISCORD_BOT_TOKEN="$DISCORD_BOT_TOKEN" \
            DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID" \
            DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET" \
            DISCORD_CALLBACK_URL="$DISCORD_CALLBACK_URL" \
            NEXT_PUBLIC_INVITE_URL="$NEXT_PUBLIC_INVITE_URL" \
            DISCORD_GUILD_ID="$DISCORD_GUILD_ID" \
            NEXTAUTH_URL="$NEXTAUTH_URL" \
            NEXTAUTH_INTERNAL_URL="$NEXTAUTH_INTERNAL_URL" \
            NEXTAUTH_SECRET="$NEXTAUTH_SECRET" \
            --app "$HEROKU_APP_NAME"

          # Deploy to Heroku Git Remote
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_APP_NAME.git
          git push -f heroku main:main
