name: Deploy HELIX to Heroku (Free-Tier Eco Dyno)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Bot & Dashboard to Heroku
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Sync GitHub Secrets to Heroku & Deploy
        if: env.HEROKU_API_KEY != '' && env.HEROKU_APP_NAME != ''
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_CALLBACK_URL: ${{ secrets.DISCORD_CALLBACK_URL }}
          NEXT_PUBLIC_INVITE_URL: ${{ secrets.NEXT_PUBLIC_INVITE_URL }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_INTERNAL_URL: ${{ secrets.NEXTAUTH_INTERNAL_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          if [ -z "$HEROKU_API_KEY" ] || [ -z "$HEROKU_APP_NAME" ]; then
            echo "Heroku credentials not configured in repository secrets. Skipping deployment."
            exit 0
          fi
          echo "Syncing GitHub Secrets to Heroku Config Vars..."
          # Install Heroku CLI
          curl https://cli-assets.heroku.com/install.sh | sh

          # Automatically resolve dynamic Heroku public URLs
          HEROKU_APP_URL="https://${HEROKU_APP_NAME}.herokuapp.com"

          EFFECTIVE_CALLBACK="$DISCORD_CALLBACK_URL"
          if [ -z "$EFFECTIVE_CALLBACK" ] || [ "$EFFECTIVE_CALLBACK" = "http://localhost:5000" ] || [ "$EFFECTIVE_CALLBACK" = "http://localhost" ]; then
            EFFECTIVE_CALLBACK="$HEROKU_APP_URL"
          fi

          EFFECTIVE_NEXTAUTH="$NEXTAUTH_URL"
          if [ -z "$EFFECTIVE_NEXTAUTH" ] || [ "$EFFECTIVE_NEXTAUTH" = "http://localhost:5000" ] || [ "$EFFECTIVE_NEXTAUTH" = "http://localhost" ]; then
            EFFECTIVE_NEXTAUTH="$HEROKU_APP_URL"
          fi

          EFFECTIVE_INVITE="$NEXT_PUBLIC_INVITE_URL"
          if [ -z "$EFFECTIVE_INVITE" ] || [[ "$EFFECTIVE_INVITE" == *"yourclientid"* ]]; then
            ENCODED_REDIRECT=$(node -e "console.log(encodeURIComponent('${EFFECTIVE_CALLBACK}/api/auth/callback/discord'))")
            EFFECTIVE_INVITE="https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&permissions=8&scope=bot&redirect_uri=${ENCODED_REDIRECT}&response_type=code"
          fi

          echo "Configuring Heroku for application $HEROKU_APP_NAME ($HEROKU_APP_URL)..."

          # Enable Heroku runtime dyno metadata
          heroku labs:enable runtime-dyno-metadata --app "$HEROKU_APP_NAME" || true

          # Set Heroku config vars from GitHub Secrets & dynamically resolved URLs
          heroku config:set \
            HEROKU_APP_NAME="$HEROKU_APP_NAME" \
            DISCORD_TOKEN="$DISCORD_TOKEN" \
            DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID" \
            DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET" \
            DISCORD_CALLBACK_URL="$EFFECTIVE_CALLBACK" \
            NEXT_PUBLIC_INVITE_URL="$EFFECTIVE_INVITE" \
            NEXTAUTH_URL="$EFFECTIVE_NEXTAUTH" \
            NEXTAUTH_INTERNAL_URL="$NEXTAUTH_INTERNAL_URL" \
            NEXTAUTH_SECRET="$NEXTAUTH_SECRET" \
            --app "$HEROKU_APP_NAME"

          # Deploy to Heroku Git Remote
          git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_APP_NAME.git
          git push -f heroku main:main
