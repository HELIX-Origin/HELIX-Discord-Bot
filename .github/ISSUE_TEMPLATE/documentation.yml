name: "Documentation Improvement"
description: "Suggest improvements, fixes, or additions to HELIX documentation"
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ### Improve HELIX Documentation
        Clear and comprehensive documentation is vital. Let us know where we can clarify, fix, or expand!

  - type: dropdown
    id: doc-section
    attributes:
      label: Affected Documentation Area
      options:
        - "README.md (Main Project Overview & Quick Start)"
        - "AGENTS.md (Root Multi-Agent Architecture Guide)"
        - "docs/index.md (Documentation Hub)"
        - "docs/discord-bot.md (Discord Bot Commands, DB & Config)"
        - "docs/web-dashboard.md (Web Dashboard, OAuth2 Flow & Endpoints)"
        - "docs/plugin-system.md (Language Plugin Architecture & Built-in Plugins)"
        - "docs/plugin-authoring.md (Plugin Authoring & Distribution Guide)"
        - "docs/scaffolding-templates.md (17 Supported Starter Templates)"
        - "docs/deployment-docker.md (Docker & Self-Hosting Guide)"
        - "docs/deployment-heroku.md (Heroku Deployment Guide)"
        - ".agents/ / .copilot/ / .gemini/ / .opencode/ (Multi-Agent Configurations)"
        - "messages.json (Central Message Formatting Engine)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Description of the Documentation Issue
      description: What is incorrect, unclear, or missing?
      placeholder: "e.g., The Plugin Authoring guide in docs/plugin-authoring.md needs an example for..."
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Revision / Proposed Content
      description: How should the documentation read instead?
    validations:
      required: true

  - type: textarea
    id: mermaid-diagram
    attributes:
      label: Proposed Mermaid Diagram (Optional)
      description: Supply a Mermaid diagram to be added or updated in the documentation.
      placeholder: |
        ```mermaid
        flowchart LR
            A["Topic A"] --> B["Topic B"]
        ```
      render: markdown

  - type: textarea
    id: sub-issues
    attributes:
      label: Documentation Sub-Tasks / Sub-Issues (Optional)
      placeholder: |
        - [ ] Sub-Issue 1: Draft Documentation
        - [ ] Sub-Issue 2: Verification & Review
        - [ ] Sub-Issue 3: Multi-Agent Mirror Sync
      render: markdown
